    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: 'Inter', system-ui, sans-serif; background: #080d1a; color: #e8edf5; -webkit-font-smoothing: antialiased; }

    select option { background: #0d1525; }
    button:focus-visible { outline: 2px solid #4d7fe0; outline-offset: 2px; }
    input:focus { border-color: #4d7fe0 !important; }

    // Limpiar caché de Babel standalone para forzar recompilación con el nuevo diseño
    (function(){
      var ver = "20260609g";
      if (localStorage.getItem("agm_ver") !== ver) {
        Object.keys(localStorage).forEach(function(k){
          if (k.startsWith("babel-") || k.startsWith("__babel")) localStorage.removeItem(k);
        });
        localStorage.setItem("agm_ver", ver);
      }
    })();
  </script>
  <script type="text/babel" src="components/MockData.jsx?v=20260525d"></script>

    window.API = {
      token: () => localStorage.getItem("auditec_token") || "",
      headers: () => ({ "Content-Type": "application/json", "Authorization": `Bearer ${window.API.token()}` }),
      _handle: (r) => {
        if (r.ok) return r.json();
        // Lee el cuerpo para extraer el mensaje de FastAPI ({"detail": "..."})
        return r.json().catch(()=>({})).then(body => {
          const msg = (body && body.detail) ? body.detail : `HTTP ${r.status}`;
          return Promise.reject(Object.assign(new Error(msg), { status: r.status }));
        });
      },
      get:  (url)       => fetch(url, { headers: window.API.headers() }).then(window.API._handle),
      post: (url, body) => fetch(url, { method:"POST", headers: window.API.headers(), body: JSON.stringify(body) }).then(window.API._handle),
      put:  (url, body) => fetch(url, { method:"PUT",  headers: window.API.headers(), body: JSON.stringify(body) }).then(window.API._handle),
    };

        "KPI cards and lane/day bars":"KPIs y barras por carril/día",

        "Salir":"Salir",
        "Fuentes AVC":"Fuentes AVC",
        "Sistema de Peaje":"Sistema de Peaje",
        "Sistema":"Sistema",
        "Usuarios y Permisos":"Usuarios y Permisos",
      },
      en: {
        "Resumen de conciliación AVC/SP por carril":"AVC/SP reconciliation summary by lane",
        "Detalle de reconciliación":"Reconciliation detail",
        "Acceso restringido":"Restricted access",
        "Solo los administradores pueden acceder a esta sección.":"Only administrators can access this section.",
        "Salir":"Logout",
        "Fuentes AVC":"AVC Sources",
        "Sistema de Peaje":"Toll System Integration",
        "Sistema":"System",
        "Usuarios y Permisos":"Users and Permissions",
      },
    };
    window.getUILanguage = () => localStorage.getItem("agm_ui_language") || "es";
    window.t = (text) => {
      const lang = window.getUILanguage();
      return (I18N[lang] && I18N[lang][text]) || text;
    };

    // Returns true only for Admin role — used to gate axle-error visibility
    window.isAdmin = () => {
      try {
        const u = window._auditecUser || JSON.parse(localStorage.getItem("auditec_user") || "{}");
        return u.role === "Admin";
      } catch(e) { return false; }
    };

    const PAGE_TITLES = {
      dashboard: { title: "Dashboard", subtitle: "Resumen de conciliación AVC/SP por carril" },
      reports:   { title: "Reports",  subtitle: "Reporte de conciliación e historial de envíos" },
      alarms:    { title: "Alarms", subtitle: "Alarm rules, open alarms and history" },
      notifications: { title: "Notifications", subtitle: "Email notification history and contact groups" },
      settings:  { title: "Settings", subtitle: "Global Email / SMTP Configuration" },
      config:    { title: "System Configuration", subtitle: "Integrations, system and users" },
    };

    function App() {
      const [user, setUser]         = React.useState(null);
      const [view, setView]         = React.useState("dashboard");
      const [activeLane, setActiveLane] = React.useState(null);
      const [activeLaneFilter, setActiveLaneFilter] = React.useState(null);
      const [activeLaneDate, setActiveLaneDate] = React.useState(null);
      const [uiLanguage, setUiLanguage] = React.useState(window.getUILanguage());

      React.useEffect(() => {
        try {
          const saved = localStorage.getItem("auditec_user");
          if (saved) setUser(JSON.parse(saved));
        } catch(e) {}
        function onLang(e) {
          const next = (e.detail && e.detail.language) || window.getUILanguage();
          localStorage.setItem("agm_ui_language", next);
          setUiLanguage(next);
        }
        window.addEventListener("agm-language-change", onLang);
        return () => window.removeEventListener("agm-language-change", onLang);
      }, []);

      React.useEffect(() => {
        if (!user) return;
        window.API.get("/api/config").then(cfg => {
          if (cfg.ui_language) {
            localStorage.setItem("agm_ui_language", cfg.ui_language);
            setUiLanguage(cfg.ui_language);
          }
        }).catch(()=>{});
      }, [user]);

      function handleLogin(u) {
        setUser(u);
        localStorage.setItem("auditec_user", JSON.stringify(u));
        window._auditecUser = u;
      }

      function handleLogout() {
        window.API.post("/api/auth/logout", {}).catch(() => {});
        localStorage.removeItem("auditec_token");
        localStorage.removeItem("auditec_user");
        setUser(null); setActiveLane(null); setActiveLaneFilter(null); setActiveLaneDate(null); setView("dashboard");
      }

      function handleNavigate(v) { setView(v); setActiveLane(null); setActiveLaneFilter(null); setActiveLaneDate(null); }
      function handleOpenLane(id, filter, selectedDate) {
        setActiveLane(id);
        setActiveLaneFilter(filter || null);
        setActiveLaneDate(selectedDate || null);
      }

      if (!user) return <LoginScreen onLogin={handleLogin}/>;

      const laneLabel = activeLane ? (LANE_CONFIGS.find(l=>l.id===activeLane)?.name || activeLane) : null;
      const viewRoot = String(view || "dashboard").split(":")[0];
      const viewSection = String(view || "").split(":")[1] || "";
      const pageInfo  = activeLane
        ? { title: laneLabel, subtitle: "Detalle de reconciliación" }
        : (PAGE_TITLES[viewRoot] || PAGE_TITLES.dashboard);

      return (
        <AppLayout user={user} onLogout={handleLogout} currentView={view}
          onNavigate={handleNavigate} title={window.t(pageInfo.title)} subtitle={window.t(pageInfo.subtitle)}>
          {view==="dashboard" && !activeLane && <Dashboard onOpenLane={handleOpenLane} user={user}/>}
          {view==="dashboard" && activeLane   && <LaneDetail laneId={activeLane} initialDate={activeLaneDate} initialFilter={activeLaneFilter} onBack={()=>{setActiveLane(null);setActiveLaneFilter(null);setActiveLaneDate(null);}}/>}
          {viewRoot==="reports" && viewSection==="view" && <ReportsScreen/>}
          {viewRoot==="reports" && viewSection!=="view" && <ReportsModule section={viewSection || "history"}/>}
          {viewRoot==="alarms" && user.role==="Admin" && <AlarmsModule section={viewSection || "active"}/>}
          {viewRoot==="notifications" && user.role==="Admin" && <NotificationsModule section={viewSection || "history"}/>}
          {viewRoot==="settings" && user.role==="Admin" && <SettingsModule/>}
          {view==="config"    && user.role==="Admin" && <ConfigScreen/>}
          {["config","alarms","notifications","settings"].includes(viewRoot) && user.role!=="Admin" && (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:12,color:"#5b6a8a"}}>
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <circle cx="24" cy="24" r="23" stroke="#2a3045" strokeWidth="1.5"/>
                <path d="M24 16v13M24 34v2" stroke="#5b6a8a" strokeWidth="2.5" strokeLinecap="round"/>
              </svg>
              <div style={{fontSize:15,fontWeight:600,color:"#e8edf5"}}>{window.t("Acceso restringido")}</div>
              <div style={{fontSize:13}}>{window.t("Solo los administradores pueden acceder a esta sección.")}</div>
            </div>
          )}
        </AppLayout>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
